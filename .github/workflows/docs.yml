# Documentation site: https://honurobotics.github.io/gltf-robotics/
# Built and deployed by the shared workflow from HonuRobotics/honu-docs.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:

jobs:
  docs:
    uses: HonuRobotics/honu-docs/.github/workflows/docs.yml@v0.2.0
    permissions:
      contents: write
    with:
      default_version: main
