[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gltf-robotics"
version = "0.1.0"
description = "glTF authoring profile, conformance checker and asset assessment for robot simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Honu Robotics" }]
keywords = ["gltf", "glb", "gazebo", "rviz", "ros", "robotics", "pbr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Documentation = "https://honurobotics.github.io/gltf-robotics/"
Source = "https://github.com/HonuRobotics/gltf-robotics"

[project.scripts]
gltf-check = "gltf_robotics.check.cli:main"
gltf-assess = "gltf_robotics.assess.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
